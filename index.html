<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agency OS</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090909;
  --s:#111111;
  --s2:#171717;
  --b:#242424;
  --b2:#303030;
  --accent:#7c5cfc;
  --ag:#a78bfa;
  --t:#efefef;
  --m:#888888;
  --m2:#555555;
  --green:#22c55e;
  --red:#f87171;
  --amber:#f59e0b;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;overflow:hidden}

/* Scrollbars */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* App shell */
.app{display:flex;flex-direction:column;height:100vh}

/* ── Topbar */
.topbar{
  display:flex;align-items:center;
  padding:0 16px;height:44px;min-height:44px;
  background:var(--s);border-bottom:1px solid var(--b);
  z-index:20;flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:8px;flex:1}
.logo-mark{
  width:22px;height:22px;
  background:var(--accent);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;letter-spacing:-.5px;flex-shrink:0;
}
.logo-text{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--t)}
.topbar-status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--m)}
.status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  transition:background 0.2s ease;flex-shrink:0;
}
.status-dot.working{background:var(--amber);animation:pulse 1.2s ease infinite}
.status-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Body layout */
.body{display:flex;flex:1;overflow:hidden}

/* ── Sidebar */
.sidebar{
  width:220px;min-width:220px;
  background:var(--s);border-right:1px solid var(--b);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sidebar-section{
  padding:16px 12px 6px;
  font-size:10px;font-weight:600;letter-spacing:.08em;
  color:var(--m2);text-transform:uppercase;
}
.emp-list{
  flex:1;overflow-y:auto;
  padding:0 6px;
}
.emp-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:7px;cursor:pointer;
  transition:background 0.15s ease;
  border-left:2px solid transparent;
  margin-bottom:1px;
}
.emp-item:hover{background:var(--s2)}
.emp-item.active{
  background:rgba(124,92,252,0.10);
  border-left:2px solid var(--accent);
}
.emp-avatar{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex-shrink:0;
  letter-spacing:0;
}
.emp-info{flex:1;min-width:0}
.emp-name{font-size:13px;font-weight:500;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-client{font-size:11px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Sidebar bottom */
.sidebar-bottom{
  padding:10px 8px;
  border-top:1px solid var(--b);
  display:flex;flex-direction:column;gap:4px;
}
.sidebar-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--m);background:none;border:none;
  width:100%;text-align:left;transition:all 0.15s ease;
}
.sidebar-btn:hover{background:var(--s2);color:var(--t)}
.sidebar-btn svg{flex-shrink:0}

/* ── Main workspace */
.workspace{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);
}

/* Empty no-employee state */
.workspace-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--m);
}
.workspace-empty p{font-size:14px}
.workspace-empty .btn-primary{margin-top:4px}

/* Employee header */
.emp-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--b);
  background:var(--s);flex-shrink:0;
}
.emp-header-avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;flex-shrink:0;
}
.emp-header-name{font-size:15px;font-weight:600;color:var(--t)}
.emp-header-meta{font-size:12px;color:var(--m)}
.emp-header-info{flex:1}

/* Messages */
.messages{
  flex:1;overflow-y:auto;
  padding:20px;display:flex;flex-direction:column;gap:20px;
}

/* No messages empty state */
.msgs-empty{
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px;gap:16px;
}
.msgs-empty-label{font-size:13px;color:var(--m);margin-bottom:4px}
.suggestion-chips{display:flex;flex-direction:column;gap:6px;width:100%;max-width:480px}
.suggestion-chip{
  padding:10px 14px;background:var(--s);border:1px solid var(--b);
  border-radius:8px;cursor:pointer;font-size:13px;color:var(--m);
  text-align:left;transition:all 0.15s ease;
}
.suggestion-chip:hover{border-color:var(--b2);color:var(--t);background:var(--s2)}

/* Message rows */
.msg{display:flex;gap:12px;align-items:flex-start}
.msg-avatar{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px;
}
.msg-avatar.user-av{background:var(--b2)}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.msg-sender{font-size:13px;font-weight:600;color:var(--t)}
.msg-time{font-size:11px;color:var(--m2)}
.msg-text{
  font-size:14px;color:var(--t);line-height:1.6;
}
.msg-text p{margin-bottom:8px}
.msg-text p:last-child{margin-bottom:0}
.msg-text ul,
.msg-text ol{padding-left:20px;margin-bottom:8px}
.msg-text li{margin-bottom:3px}
.msg-text code{
  background:var(--s2);border:1px solid var(--b);
  padding:1px 5px;border-radius:4px;font-size:12px;
  font-family:'SF Mono','Fira Code',monospace;
}
.msg-text pre{
  background:var(--s);border:1px solid var(--b);
  padding:12px;border-radius:8px;overflow-x:auto;margin-bottom:8px;
}
.msg-text pre code{background:none;border:none;padding:0;font-size:12px}
.msg-text h1,.msg-text h2,.msg-text h3{
  color:var(--t);margin-bottom:6px;margin-top:12px;
}
.msg-text h1{font-size:17px}
.msg-text h2{font-size:15px}
.msg-text h3{font-size:14px}
.msg-text strong{color:var(--t);font-weight:600}
.msg-text a{color:var(--ag);text-decoration:none}
.msg-text a:hover{text-decoration:underline}

/* Typing indicator */
.typing-dots span{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--m);margin:0 1.5px;
  animation:blink 1.2s ease infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* Input area */
.input-area{
  padding:12px 20px 14px;
  border-top:1px solid var(--b);
  background:var(--s);
  flex-shrink:0;
}
.input-wrap{
  display:flex;align-items:flex-end;gap:8px;
  border:1px solid var(--b);border-radius:8px;
  background:var(--bg);padding:10px 12px;
  transition:border-color 0.15s ease;
}
.input-wrap:focus-within{border-color:var(--b2)}
#msg-input{
  flex:1;background:none;border:none;outline:none;
  color:var(--t);font-size:14px;line-height:1.5;
  resize:none;min-height:22px;max-height:160px;
  font-family:inherit;
}
#msg-input::placeholder{color:var(--m2)}
.send-btn{
  width:28px;height:28px;border-radius:6px;
  background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity 0.15s ease;color:#fff;
}
.send-btn:hover{opacity:.85}
.send-btn:disabled{opacity:.3;cursor:default}

/* Tool chips */
.tool-chips{
  display:flex;gap:6px;margin-top:10px;
}
.tool-chip{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:20px;
  border:1px solid var(--b);background:none;
  font-size:12px;color:var(--m);cursor:pointer;
  transition:all 0.15s ease;font-family:inherit;
}
.tool-chip:hover{border-color:var(--accent);color:var(--ag)}

/* API key error */
.api-error{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 14px;margin:0 0 8px;
  background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);
  border-radius:7px;font-size:12px;color:var(--red);
  font-family:'SF Mono','Fira Code',monospace;line-height:1.5;
}

/* ── Drawer */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:30;opacity:0;pointer-events:none;
  transition:opacity 0.2s ease;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:420px;
  background:var(--s);border-left:1px solid var(--b);
  z-index:31;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform 0.2s ease;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;align-items:center;padding:16px 18px;
  border-bottom:1px solid var(--b);flex-shrink:0;gap:10px;
}
.drawer-title{font-size:15px;font-weight:600;color:var(--t);flex:1}
.drawer-close{
  width:26px;height:26px;border-radius:5px;background:none;
  border:none;cursor:pointer;color:var(--m);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s ease;
}
.drawer-close:hover{background:var(--s2);color:var(--t)}
.drawer-body{flex:1;overflow-y:auto;padding:18px}

/* ── Reports drawer */
.report-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:7px;
  border:1px solid var(--b);margin-bottom:6px;cursor:pointer;
  transition:all 0.15s ease;
}
.report-row:hover{border-color:var(--b2);background:var(--s2)}
.report-row-name{font-size:13px;color:var(--t);flex:1}
.report-row-date{font-size:11px;color:var(--m)}
.report-content{
  margin-top:14px;padding:14px;
  background:var(--bg);border:1px solid var(--b);
  border-radius:8px;font-size:13px;color:var(--t);
  line-height:1.7;
}
.report-content h1,.report-content h2,.report-content h3{
  color:var(--t);margin-bottom:8px;margin-top:14px;
}
.report-content h1{font-size:17px}
.report-content h2{font-size:15px}
.report-content h3{font-size:13px;font-weight:600}
.report-content ul,.report-content ol{padding-left:18px;margin-bottom:8px}
.report-content li{margin-bottom:3px}
.report-content p{margin-bottom:8px}
.report-content strong{font-weight:600}

/* Terminal output */
.terminal-box{
  background:var(--bg);border:1px solid var(--b);
  border-radius:8px;padding:12px;
  font-family:'SF Mono','Fira Code',monospace;
  font-size:12px;color:#a3e6a3;line-height:1.6;
  min-height:120px;max-height:300px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-word;
  margin-top:12px;
}

/* Concept cards */
.concept-card{
  border:1px solid var(--b);border-radius:8px;
  padding:14px;margin-bottom:10px;background:var(--bg);
}
.concept-card-title{font-size:13px;font-weight:600;color:var(--ag);margin-bottom:8px}
.concept-row{margin-bottom:6px;font-size:13px}
.concept-label{color:var(--m);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.concept-val{color:var(--t);line-height:1.5}
.concept-score{
  display:inline-block;margin-top:8px;
  padding:2px 8px;border-radius:4px;
  font-size:11px;font-weight:600;
  background:rgba(124,92,252,0.15);color:var(--ag);
}

/* Image grid */
.image-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:14px;
}
.image-card{
  border:1px solid var(--b);border-radius:8px;
  overflow:hidden;position:relative;background:var(--s2);
}
.image-card img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.image-card-dl{
  position:absolute;bottom:6px;right:6px;
  background:rgba(9,9,9,0.8);border:1px solid var(--b2);
  border-radius:5px;padding:4px 8px;
  font-size:11px;color:var(--t);cursor:pointer;
  transition:all 0.15s ease;
}
.image-card-dl:hover{background:var(--s2)}

/* ── Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px);z-index:50;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.2s ease;
}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--s);border:1px solid var(--b);
  border-radius:12px;width:100%;max-width:440px;
  padding:24px;
  transform:scale(.96);transition:transform 0.2s ease;
}
.modal-backdrop.open .modal{transform:scale(1)}
.modal-title{font-size:16px;font-weight:600;color:var(--t);margin-bottom:20px}

/* Form elements */
.field{margin-bottom:14px}
.field label{
  display:block;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--m);margin-bottom:6px;
}
.field input,
.field textarea,
.field select{
  width:100%;background:var(--bg);border:1px solid var(--b);
  border-radius:7px;padding:9px 11px;
  color:var(--t);font-size:13px;font-family:inherit;
  outline:none;transition:border-color 0.15s ease;
}
.field input:focus,
.field textarea:focus,
.field select:focus{border-color:var(--accent)}
.field input::placeholder,
.field textarea::placeholder{color:var(--m2)}
.field select{appearance:none;cursor:pointer}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}

/* Buttons */
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border:none;
  padding:9px 18px;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:opacity 0.15s ease;
}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.35;cursor:default}
.btn-secondary{
  display:inline-flex;align-items:center;gap:6px;
  background:none;color:var(--m);border:1px solid var(--b);
  padding:8px 14px;border-radius:7px;
  font-size:13px;cursor:pointer;font-family:inherit;
  transition:all 0.15s ease;
}
.btn-secondary:hover{border-color:var(--b2);color:var(--t)}

/* Misc */
.flex-row{display:flex;align-items:center;gap:8px}
.mt-12{margin-top:12px}
.mt-8{margin-top:8px}
.text-m{color:var(--m);font-size:13px}
.text-muted{color:var(--m2);font-size:12px}
.w-full{width:100%}

/* View in reports btn */
.view-reports-btn{display:none;margin-top:10px}
.view-reports-btn.visible{display:inline-flex}

/* ── Desk floor */
.desk-floor{
  flex:1;display:flex;flex-wrap:wrap;
  gap:14px;padding:32px;
  align-content:flex-start;overflow-y:auto;
}
.desk-floor-title{
  width:100%;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--m2);margin-bottom:4px;
}
.desk-card{
  width:152px;background:var(--s);border:1px solid var(--b);
  border-radius:10px;padding:16px 14px;cursor:pointer;
  transition:all 0.18s ease;display:flex;flex-direction:column;
  align-items:center;gap:7px;text-align:center;
}
.desk-card:hover{border-color:var(--b2);background:var(--s2);transform:translateY(-2px)}
.desk-card.add-card{border-style:dashed;border-color:var(--b)}
.desk-card.add-card:hover{border-color:var(--b2)}
.desk-svg{opacity:.7}
.desk-card-av{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;margin-top:2px;
}
.desk-card-name{font-size:13px;font-weight:600;color:var(--t)}
.desk-card-client{font-size:11px;color:var(--m);line-height:1.3;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desk-card-add-label{font-size:13px;color:var(--m)}
.desk-card-plus{font-size:22px;color:var(--m2);line-height:1;margin-bottom:2px}
</style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">A</div>
      <span class="logo-text">Agency OS</span>
    </div>
    <div class="topbar-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">Team</div>
      <div class="emp-list" id="emp-list">
        <!-- employees rendered here -->
      </div>
      <div class="sidebar-bottom">
        <button class="sidebar-btn" onclick="openCreateModal()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          New Employee
        </button>
        <button class="sidebar-btn" onclick="openDrawer('reports')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M4 5h6M4 7.5h6M4 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Reports
        </button>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace" id="workspace">
      <div class="workspace-empty" id="no-employee-state">
        <p>Select an employee from the sidebar, or create one to get started.</p>
        <button class="btn-primary" onclick="openCreateModal()">+ New Employee</button>
      </div>
    </div>

  </div><!-- /body -->
</div><!-- /app -->

<!-- ── Create Employee Modal -->
<div class="modal-backdrop" id="create-modal" onclick="handleModalBackdropClick(event)">
  <div class="modal">
    <div class="modal-title">New Employee</div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="f-name" placeholder="e.g. Ace" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Role</label>
      <input type="text" id="f-role" placeholder="e.g. Ad Strategist" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Client / Niche</label>
      <input type="text" id="f-client" placeholder="e.g. Health Insurance – Lakeland, FL" autocomplete="off"/>
    </div>
    <div class="flex-row mt-12" style="justify-content:flex-end;gap:8px">
      <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
      <button class="btn-primary" onclick="createEmployee()">Create Employee</button>
    </div>
  </div>
</div>

<!-- ── Drawer backdrop -->
<div class="drawer-backdrop" id="drawer-backdrop" onclick="closeDrawer()"></div>

<!-- ── Research Drawer -->
<div class="drawer" id="drawer-research">
  <div class="drawer-head">
    <span class="drawer-title">Competitor Research</span>
    <button class="drawer-close" onclick="closeDrawer()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label>Search Query</label>
      <input type="text" id="research-query" placeholder="e.g. Health Insurance ads Lakeland FL"/>
    </div>
    <button class="btn-primary w-full" id="research-run-btn" onclick="runResearch()">Run Research</button>
    <div class="terminal-box" id="research-output" style="display:none"></div>
    <button class="btn-secondary view-reports-btn" id="view-reports-btn" onclick="openDrawer('reports')">View in Reports →</button>
  </div>
</div>

<!-- ── Concepts Drawer -->
<div class="drawer" id="drawer-concepts">
  <div class="drawer-head">
    <span class="drawer-title">Ad Concepts</span>
    <button class="drawer-close" onclick="closeDrawer()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

<script>
// ── State
const AVATAR_COLORS = ['#7c5cfc','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#6366f1'];
let employees = [];
let activeEmployeeId = null;
let activeDrawer = null;

// ── Employee CRUD

function loadEmployees() {
  try {
    employees = JSON.parse(localStorage.getItem('agencyos_employees') || '[]');
  } catch {
    employees = [];
  }
}

function saveEmployees() {
  localStorage.setItem('agencyos_employees', JSON.stringify(employees));
}

function getMsgs(empId) {
  try {
    return JSON.parse(localStorage.getItem(`agencyos_msgs_${empId}`) || '[]');
  } catch {
    return [];
  }
}

function saveMsgs(empId, msgs) {
  localStorage.setItem(`agencyos_msgs_${empId}`, JSON.stringify(msgs));
}

function createEmployee() {
  const name = document.getElementById('f-name').value.trim();
  const role = document.getElementById('f-role').value.trim();
  const client = document.getElementById('f-client').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  const colorIdx = employees.length % AVATAR_COLORS.length;
  const emp = {
    id: 'emp_' + Date.now(),
    name,
    role: role || 'Strategist',
    client: client || '',
    color: AVATAR_COLORS[colorIdx],
    createdAt: Date.now()
  };
  employees.push(emp);
  saveEmployees();
  closeCreateModal();
  renderSidebar();
  selectEmployee(emp.id);
}

const AGENT_NAMES = ['Ace','Nova','Bolt','Iris','Kai','Rex','Zara','Echo','Max','Leo','Sage','Flynn','Cruz','Skye','Reed','Wren'];
const AGENT_ROLES = ['Ad Strategist','Copy Specialist','Research Analyst','Creative Director','Media Buyer','Campaign Manager'];

function openCreateModal() {
  const used = employees.map(e => e.name);
  const available = AGENT_NAMES.filter(n => !used.includes(n));
  const name = available.length ? available[Math.floor(Math.random()*available.length)] : 'Agent';
  const role = AGENT_ROLES[employees.length % AGENT_ROLES.length];
  document.getElementById('f-name').value = name;
  document.getElementById('f-role').value = role;
  document.getElementById('f-client').value = '';
  document.getElementById('create-modal').classList.add('open');
  setTimeout(() => document.getElementById('f-client').focus(), 100);
}

function closeCreateModal() {
  document.getElementById('create-modal').classList.remove('open');
}

function handleModalBackdropClick(e) {
  if (e.target === e.currentTarget) closeCreateModal();
}

// ── Sidebar rendering

function renderSidebar() {
  const list = document.getElementById('emp-list');
  if (employees.length === 0) {
    list.innerHTML = `<div style="padding:16px 10px;text-align:center">
      <p style="color:var(--m2);font-size:12px;margin-bottom:12px">No employees yet</p>
      <button class="btn-primary" style="font-size:12px;padding:7px 14px" onclick="openCreateModal()">Create your first employee</button>
    </div>`;
    return;
  }
  list.innerHTML = employees.map(emp => `
    <div class="emp-item${emp.id === activeEmployeeId ? ' active' : ''}" onclick="selectEmployee('${emp.id}')">
      <div class="emp-avatar" style="background:${emp.color}">${emp.name.charAt(0).toUpperCase()}</div>
      <div class="emp-info">
        <div class="emp-name">${escHtml(emp.name)}</div>
        <div class="emp-client">${escHtml(emp.client || emp.role)}</div>
      </div>
    </div>
  `).join('');
}

function selectEmployee(id) {
  activeEmployeeId = id;
  renderSidebar();
  renderWorkspace();
}

// ── Workspace rendering

function deskSVG() {
  return `<svg class="desk-svg" width="72" height="50" viewBox="0 0 72 50" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="16" width="70" height="32" rx="5" fill="#1a1a1a" stroke="#2e2e2e"/>
    <rect x="22" y="4" width="28" height="18" rx="3" fill="#141420" stroke="#2a2a35"/>
    <rect x="24" y="6" width="24" height="14" rx="2" fill="#0c0c18"/>
    <rect x="31" y="21" width="10" height="3" fill="#222"/>
    <rect x="13" y="31" width="46" height="10" rx="2" fill="#141414" stroke="#282828"/>
    <ellipse cx="62" cy="27" rx="4" ry="5" fill="#141414" stroke="#282828"/>
  </svg>`;
}

function renderWorkspace() {
  const ws = document.getElementById('workspace');
  if (!activeEmployeeId) {
    if (employees.length === 0) {
      ws.innerHTML = `<div class="workspace-empty">
        <p>No employees yet. Create your first one to get started.</p>
        <button class="btn-primary" onclick="openCreateModal()">+ New Employee</button>
      </div>`;
    } else {
      ws.innerHTML = `<div class="desk-floor">
        <div class="desk-floor-title">Your Team</div>
        ${employees.map(emp => `
          <div class="desk-card" onclick="selectEmployee('${emp.id}')">
            ${deskSVG()}
            <div class="desk-card-av" style="background:${emp.color}">${emp.name.charAt(0)}</div>
            <div class="desk-card-name">${escHtml(emp.name)}</div>
            <div class="desk-card-client">${escHtml(emp.client || emp.role)}</div>
          </div>`).join('')}
        <div class="desk-card add-card" onclick="openCreateModal()">
          <div class="desk-card-plus">+</div>
          <div class="desk-card-add-label">New Employee</div>
        </div>
      </div>`;
    }
    return;
  }
  const emp = employees.find(e => e.id === activeEmployeeId);
  if (!emp) return;
  ws.innerHTML = `
    <div class="emp-header">
      <div class="emp-header-avatar" style="background:${emp.color}">${emp.name.charAt(0).toUpperCase()}</div>
      <div class="emp-header-info">
        <div class="emp-header-name">${escHtml(emp.name)}</div>
        <div class="emp-header-meta">${escHtml(emp.role)}${emp.client ? ' · ' + escHtml(emp.client) : ''}</div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div id="api-error-banner" style="display:none"></div>
      <div class="input-wrap">
        <textarea id="msg-input" placeholder="Message ${escHtml(emp.name)}..." rows="1" onkeydown="handleInputKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 13L13 7 1 1v4.5l8.5 1.5-8.5 1.5V13z" fill="white"/></svg>
        </button>
      </div>
      <div class="tool-chips">
        <button class="tool-chip" onclick="openDrawer('research')">🔍 Research</button>
        <button class="tool-chip" onclick="openDrawer('concepts')">💡 Concepts</button>
        <button class="tool-chip" onclick="openDrawer('images')">🎨 Images</button>
      </div>
    </div>
  `;
  renderMessages();
  setTimeout(() => {
    const inp = document.getElementById('msg-input');
    if (inp) inp.focus();
  }, 50);
}

function renderMessages() {
  const emp = employees.find(e => e.id === activeEmployeeId);
  if (!emp) return;
  const msgs = getMsgs(activeEmployeeId);
  const container = document.getElementById('messages');
  if (!container) return;
  if (msgs.length === 0) {
    container.innerHTML = `
      <div class="msgs-empty">
        <p class="msgs-empty-label">Start a conversation, or try a suggestion</p>
        <div class="suggestion-chips">
          <button class="suggestion-chip" onclick="sendSuggestion(this.textContent)">Analyze the top hooks working in ${escHtml(emp.client || emp.role)} right now</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this.textContent)">What offers are converting best for ${escHtml(emp.client || emp.role)}?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this.textContent)">Write 5 scroll-stopping hooks for ${escHtml(emp.client || emp.role)}</button>
        </div>
      </div>
    `;
    return;
  }
  container.innerHTML = msgs.map(msg => renderMsgHtml(msg, emp)).join('');
  container.scrollTop = container.scrollHeight;
}

function renderMsgHtml(msg, emp) {
  const isUser = msg.role === 'user';
  const avatar = isUser
    ? `<div class="msg-avatar user-av">U</div>`
    : `<div class="msg-avatar" style="background:${emp.color}">${emp.name.charAt(0).toUpperCase()}</div>`;
  const sender = isUser ? 'You' : escHtml(emp.name);
  const time = msg.ts ? new Date(msg.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
  const parsed = isUser ? `<p>${escHtml(msg.content)}</p>` : (typeof marked !== 'undefined' ? marked.parse(msg.content) : `<p>${escHtml(msg.content)}</p>`);
  return `
    <div class="msg">
      ${avatar}
      <div class="msg-body">
        <div class="msg-meta">
          <span class="msg-sender">${sender}</span>
          <span class="msg-time">${time}</span>
        </div>
        <div class="msg-text">${parsed}</div>
      </div>
    </div>
  `;
}

function appendTypingIndicator(emp) {
  const container = document.getElementById('messages');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'msg';
  el.id = 'typing-indicator';
  el.innerHTML = `
    <div class="msg-avatar" style="background:${emp.color}">${emp.name.charAt(0).toUpperCase()}</div>
    <div class="msg-body">
      <div class="msg-meta"><span class="msg-sender">${escHtml(emp.name)}</span></div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  `;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ── Chat

function buildSystemPrompt(emp) {
  return `You are ${emp.name}, a ${emp.role} at a performance advertising agency.

Your assigned client/niche: ${emp.client}

You are an expert in this specific market. You help with:
- Competitor research and market analysis
- Ad copy, hooks, headlines, and offers
- Campaign strategy and creative concepts
- Meta Ads optimization
- Market positioning and differentiation

Be direct, specific, and action-oriented. Think like a senior media buyer + direct response copywriter who knows this niche deeply. Write actual copy, not descriptions of copy. When you write hooks, they should be real deployable hooks.`;
}

async function sendMessage(overrideText) {
  const emp = employees.find(e => e.id === activeEmployeeId);
  if (!emp) return;
  const inputEl = document.getElementById('msg-input');
  const text = overrideText !== undefined ? overrideText : (inputEl ? inputEl.value.trim() : '');
  if (!text) return;

  // Smart routing
  if (smartRoute(text, emp)) return;

  if (inputEl) { inputEl.value = ''; autoGrow(inputEl); }
  hideBanner();

  const msgs = getMsgs(activeEmployeeId);
  msgs.push({ role: 'user', content: text, ts: Date.now() });
  saveMsgs(activeEmployeeId, msgs);
  renderMessages();
  appendTypingIndicator(emp);
  setStatus('working', 'Thinking...');
  setInputEnabled(false);

  try {
    const apiMsgs = msgs.map(m => ({ role: m.role, content: m.content }));
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: apiMsgs, system: buildSystemPrompt(emp) })
    });
    const data = await res.json();
    if (!res.ok) {
      const err = data.error || JSON.stringify(data);
      removeTypingIndicator();
      if (/key|auth|api/i.test(err)) {
        showBanner('⚠ Set ANTHROPIC_API_KEY in agency-command-center/.env and restart node server.js');
      } else {
        showBanner('⚠ ' + escHtml(err));
      }
      setStatus('error', 'Error');
      setInputEnabled(true);
      return;
    }
    const reply = data.content?.[0]?.text || data.text || data.message || '';
    removeTypingIndicator();
    msgs.push({ role: 'assistant', content: reply, ts: Date.now() });
    saveMsgs(activeEmployeeId, msgs);
    renderMessages();
    setStatus('ready', 'Ready');
  } catch (err) {
    removeTypingIndicator();
    showBanner('⚠ Could not connect to server. Is node server.js running?');
    setStatus('error', 'Error');
  }
  setInputEnabled(true);
}

function sendSuggestion(text) {
  const inputEl = document.getElementById('msg-input');
  if (inputEl) { inputEl.value = text; autoGrow(inputEl); }
  sendMessage();
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function setInputEnabled(on) {
  const btn = document.getElementById('send-btn');
  const inp = document.getElementById('msg-input');
  if (btn) btn.disabled = !on;
  if (inp) inp.disabled = !on;
}

function showBanner(msg) {
  const b = document.getElementById('api-error-banner');
  if (!b) return;
  b.style.display = 'flex';
  b.className = 'api-error';
  b.textContent = msg;
}

function hideBanner() {
  const b = document.getElementById('api-error-banner');
  if (b) b.style.display = 'none';
}

// ── Tools: Research

async function runResearch(autoQuery) {
  const queryEl = document.getElementById('research-query');
  const query = autoQuery || (queryEl ? queryEl.value.trim() : '');
  if (!query) { queryEl && queryEl.focus(); return; }
  if (queryEl && autoQuery) queryEl.value = autoQuery;

  const outEl = document.getElementById('research-output');
  const btn = document.getElementById('research-run-btn');
  const vrBtn = document.getElementById('view-reports-btn');
  outEl.style.display = 'block';
  outEl.textContent = '$ Starting research...\n';
  btn.disabled = true;
  if (vrBtn) vrBtn.classList.remove('visible');
  setStatus('working', 'Scraping...');

  try {
    const url = `/api/scrape?q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if (!res.ok) {
      if (res.status === 404) {
        outEl.textContent += '\n[Error: Local server not running]\n\nThe scraper only works locally.\nTo fix: double-click start.command on your desktop,\nor run:  node server.js\nthen refresh and try again.';
      } else {
        outEl.textContent += `\n[Error ${res.status}: ${res.statusText}]`;
      }
      setStatus('error', 'Error');
      btn.disabled = false;
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let streamDone = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw || raw === '[DONE]') continue;
        try {
          const obj = JSON.parse(raw);
          if (obj.type === 'start') {
            outEl.textContent += `▶ Searching: "${obj.query}"\n`;
          } else if (obj.type === 'log') {
            outEl.textContent += obj.line + '\n';
          } else if (obj.type === 'err') {
            outEl.textContent += '✗ ' + obj.line + '\n';
          } else if (obj.type === 'done') {
            streamDone = true;
            if (obj.code === 0) {
              outEl.textContent += '\n✓ Research complete!\n';
              if (vrBtn) vrBtn.classList.add('visible');
              setStatus('ready', 'Ready');
            } else {
              outEl.textContent += '\n✗ Scraper exited with errors.\n';
              setStatus('error', 'Error');
            }
          }
        } catch {
          outEl.textContent += raw + '\n';
        }
        outEl.scrollTop = outEl.scrollHeight;
      }
    }
    if (!streamDone) {
      outEl.textContent += '\n$ Stream ended.\n';
      setStatus('ready', 'Ready');
    }
  } catch (err) {
    outEl.textContent += `\n[Error: ${err.message}]`;
    setStatus('error', 'Error');
  }
  btn.disabled = false;
}

// ── Tools: Concepts

async function generateConcepts() {
  const emp = employees.find(e => e.id === activeEmployeeId);
  const niche = document.getElementById('concepts-niche').value.trim();
  const audience = document.getElementById('concepts-audience').value.trim();
  const offer = document.getElementById('concepts-offer').value.trim();
  const tone = document.getElementById('concepts-tone').value;
  const outEl = document.getElementById('concepts-output');
  const btn = document.getElementById('concepts-gen-btn');
  if (!niche) { document.getElementById('concepts-niche').focus(); return; }

  btn.disabled = true;
  outEl.innerHTML = '<p class="text-m">Generating concepts...</p>';
  setStatus('working', 'Thinking...');

  const system = emp ? buildSystemPrompt(emp) : `You are an expert performance advertising strategist.`;
  const prompt = `Generate exactly 5 ad concepts for the following brief. Return ONLY a valid JSON array. No explanation, no markdown, no wrapping text. Just the raw JSON array.

Brief:
- Niche: ${niche}
- Audience: ${audience || 'general'}
- Offer: ${offer || 'not specified'}
- Tone: ${tone}

Each concept must be a JSON object with exactly these fields:
{
  "title": "Concept name (2-5 words)",
  "hook": "The opening line (15-25 words max, deployable as-is)",
  "body": "2-3 sentences of ad copy",
  "cta": "Call to action text",
  "score": <number 1-10>
}

Return only the JSON array, nothing else.`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: prompt }], system })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'API error');
    const raw = data.content?.[0]?.text || data.text || '';
    let concepts;
    try {
      const match = raw.match(/\[[\s\S]*\]/);
      concepts = JSON.parse(match ? match[0] : raw);
    } catch {
      outEl.innerHTML = `<p class="text-m">Could not parse response.</p><pre style="font-size:11px;color:var(--m);margin-top:8px;white-space:pre-wrap">${escHtml(raw)}</pre>`;
      btn.disabled = false;
      setStatus('ready', 'Ready');
      return;
    }
    outEl.innerHTML = concepts.map(c => `
      <div class="concept-card">
        <div class="concept-card-title">${escHtml(c.title)}</div>
        <div class="concept-row">
          <div class="concept-label">Hook</div>
          <div class="concept-val">"${escHtml(c.hook)}"</div>
        </div>
        <div class="concept-row">
          <div class="concept-label">Body</div>
          <div class="concept-val">${escHtml(c.body)}</div>
        </div>
        <div class="concept-row">
          <div class="concept-label">CTA</div>
          <div class="concept-val">${escHtml(c.cta)}</div>
        </div>
        <span class="concept-score">${c.score}/10</span>
      </div>
    `).join('');
    setStatus('ready', 'Ready');
  } catch (err) {
    outEl.innerHTML = `<p style="color:var(--red);font-size:13px">Error: ${escHtml(err.message)}</p>`;
    setStatus('error', 'Error');
  }
  btn.disabled = false;
}

// ── Tools: Images

const IMAGE_FORMATS = {
  feed:   { w: 1200, h: 628 },
  square: { w: 1080, h: 1080 },
  story:  { w: 1080, h: 1920 }
};

async function generateImages() {
  const emp = employees.find(e => e.id === activeEmployeeId);
  const brief = document.getElementById('images-brief').value.trim();
  const format = document.getElementById('images-format').value;
  const style = document.getElementById('images-style').value;
  const outEl = document.getElementById('images-output');
  const btn = document.getElementById('images-gen-btn');
  if (!brief) { document.getElementById('images-brief').focus(); return; }

  btn.disabled = true;
  outEl.style.display = 'none';
  outEl.innerHTML = '';
  setStatus('working', 'Thinking...');

  const { w, h } = IMAGE_FORMATS[format] || IMAGE_FORMATS.square;

  // Enhance the prompt via /api/chat
  let enhancedPrompt = brief;
  try {
    const enhanceSystem = `You are a professional ad creative director and photography prompt writer. When given a brief, return ONLY the enhanced prompt text — no explanation, no quotes, no markdown. Just the optimized image generation prompt.`;
    const enhanceMsg = `Create a professional ad photography prompt for:
Brief: ${brief}
Style: ${style}
Format: ${w}x${h}px
Client/Niche: ${emp ? emp.client : ''}

The prompt should be specific, visual, and optimized for ${style.toLowerCase()} ad imagery. Return only the prompt text.`;
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: enhanceMsg }], system: enhanceSystem })
    });
    if (res.ok) {
      const data = await res.json();
      enhancedPrompt = data.content?.[0]?.text || data.text || brief;
      enhancedPrompt = enhancedPrompt.trim().replace(/^["']|["']$/g, '');
    }
  } catch {}

  setStatus('working', 'Generating images...');
  const seeds = [Math.floor(Math.random()*9999), Math.floor(Math.random()*9999), Math.floor(Math.random()*9999), Math.floor(Math.random()*9999)];
  const styleTag = `, ${style.toLowerCase()} style, professional advertising photography, high quality`;
  const finalPrompt = encodeURIComponent(enhancedPrompt + styleTag);

  outEl.style.display = 'grid';
  outEl.innerHTML = seeds.map(s => `
    <div class="image-card" id="imgcard-${s}">
      <div style="aspect-ratio:${w}/${h};background:var(--s2);display:flex;align-items:center;justify-content:center">
        <span class="text-muted">Loading...</span>
      </div>
    </div>
  `).join('');

  seeds.forEach(seed => {
    const imgUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=${w}&height=${h}&seed=${seed}&nologo=true&enhance=true`;
    const card = document.getElementById(`imgcard-${seed}`);
    if (!card) return;
    const img = new Image();
    img.onload = () => {
      card.innerHTML = `
        <img src="${imgUrl}" alt="Generated ad creative"/>
        <button class="image-card-dl" onclick="downloadImage('${imgUrl}', 'ad-creative-${seed}.jpg')">↓</button>
      `;
    };
    img.onerror = () => {
      card.innerHTML = `<div style="padding:20px;text-align:center;color:var(--m);font-size:12px">Failed to load</div>`;
    };
    img.src = imgUrl;
  });

  setStatus('ready', 'Ready');
  btn.disabled = false;
}

function downloadImage(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.target = '_blank';
  a.click();
}

// ── Tools: Reports

async function loadReports() {
  const listEl = document.getElementById('reports-list');
  if (!listEl) return;
  listEl.innerHTML = '<p class="text-m">Loading...</p>';
  try {
    const res = await fetch('/api/reports');
    if (!res.ok) throw new Error('Could not load reports');
    const data = await res.json();
    const files = data.files || data || [];
    if (files.length === 0) {
      listEl.innerHTML = '<p class="text-m">No reports yet. Run a research session to generate one.</p>';
      return;
    }
    listEl.innerHTML = files.map(f => {
      const name = typeof f === 'string' ? f : f.name || f.file;
      const date = f.date || f.modified || '';
      return `<div class="report-row" onclick="openReport('${escHtml(name)}')">
        <div class="report-row-name">${escHtml(name)}</div>
        <div class="report-row-date">${date ? new Date(date).toLocaleDateString() : ''}</div>
      </div>`;
    }).join('');
  } catch (err) {
    listEl.innerHTML = `<p style="color:var(--red);font-size:13px">Error: ${escHtml(err.message)}</p>`;
  }
}

async function openReport(filename) {
  const listEl = document.getElementById('reports-list');
  const wrapEl = document.getElementById('report-content-wrap');
  const contentEl = document.getElementById('report-content');
  if (!listEl || !wrapEl || !contentEl) return;
  listEl.style.display = 'none';
  wrapEl.style.display = '';
  contentEl.innerHTML = '<p class="text-m">Loading report...</p>';
  try {
    const res = await fetch(`/api/report?file=${encodeURIComponent(filename)}`);
    if (!res.ok) throw new Error('Could not load report');
    const data = await res.json();
    const content = data.content || String(data);
    contentEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(content) : `<pre style="white-space:pre-wrap">${escHtml(content)}</pre>`;
  } catch (err) {
    contentEl.innerHTML = `<p style="color:var(--red);font-size:13px">Error: ${escHtml(err.message)}</p>`;
  }
}

// ── Smart routing

function smartRoute(text, emp) {
  if (/research|scrape|competitor|ads?\s+(?:for|in)|meta\s+ad/i.test(text)) {
    const clean = text.replace(/^(research|scrape|find|look up|search for|what are|show me|analyze)\s*/i, '').trim();
    openDrawer('research');
    setTimeout(() => {
      const qEl = document.getElementById('research-query');
      if (qEl) {
        qEl.value = clean || (emp ? emp.client : '');
        setTimeout(() => runResearch(qEl.value), 300);
      }
    }, 50);
    return true;
  }
  if (/\bconcepts?\b|\bhooks?\b|\bangles?\b|\bcopy\b|\bwrite\b/i.test(text)) {
    openDrawer('concepts');
    setTimeout(() => {
      const nEl = document.getElementById('concepts-niche');
      if (nEl && emp) nEl.value = emp.client || '';
    }, 50);
    return true;
  }
  return false;
}

// ── UI helpers

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-text');
  if (dot) { dot.className = 'status-dot' + (state === 'working' ? ' working' : state === 'error' ? ' error' : ''); }
  if (label) label.textContent = text;
}

function openDrawer(name) {
  closeDrawer(false);
  const backdrop = document.getElementById('drawer-backdrop');
  const drawer = document.getElementById(`drawer-${name}`);
  if (!drawer) return;
  activeDrawer = name;
  backdrop.classList.add('open');
  drawer.classList.add('open');
  // Pre-fill fields when opening
  const emp = employees.find(e => e.id === activeEmployeeId);
  if (emp) {
    if (name === 'research') {
      const qEl = document.getElementById('research-query');
      if (qEl && !qEl.value) qEl.value = emp.client || '';
    }
    if (name === 'concepts') {
      const nEl = document.getElementById('concepts-niche');
      if (nEl && !nEl.value) nEl.value = emp.client || '';
    }
    if (name === 'images') {
      const bEl = document.getElementById('images-brief');
      if (bEl && !bEl.value) bEl.value = `Create a compelling ad image for ${emp.client || emp.role}`;
    }
  }
  if (name === 'reports') {
    document.getElementById('report-content-wrap').style.display = 'none';
    const listEl = document.getElementById('reports-list');
    if (listEl) listEl.style.display = '';
    loadReports();
  }
}

function closeDrawer(resetActive = true) {
  if (resetActive) activeDrawer = null;
  document.getElementById('drawer-backdrop').classList.remove('open');
  ['research','concepts','images','reports'].forEach(n => {
    const d = document.getElementById(`drawer-${n}`);
    if (d) d.classList.remove('open');
  });
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeCreateModal();
    closeDrawer();
  }
});

loadEmployees();
renderSidebar();
renderWorkspace();
</script>
